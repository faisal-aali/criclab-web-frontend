# Lint and build must pass. Deploy runs only after CI on main (merge or dispatch).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE: /api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    env:
      APP_DIR: /var/www/criclab-web-frontend
      VITE_API_BASE: /api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: git pull
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: bash deploy/pull.sh "$APP_DIR" main

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Restart
        working-directory: ${{ env.APP_DIR }}
        run: |
          if command -v pm2 >/dev/null && pm2 describe criclab-frontend >/dev/null 2>&1; then
            pm2 restart criclab-frontend --update-env
            pm2 save
          fi
