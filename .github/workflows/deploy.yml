# git pull → npm ci → lint → build → pm2 restart
name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lightsail-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_DIR: /var/www/criclab-web-frontend
      VITE_API_BASE: /api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: git pull
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash deploy/pull.sh "$APP_DIR" main

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Restart
        working-directory: ${{ env.APP_DIR }}
        run: |
          if command -v pm2 >/dev/null && pm2 describe criclab-frontend >/dev/null 2>&1; then
            pm2 restart criclab-frontend --update-env
            pm2 save
          fi
