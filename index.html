<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="module" src="/src/pwa/registerSw.ts"></script>
    <script>
      (function () {
        window.__CRICLAB_PWA = window.__CRICLAB_PWA || { deferred: null }
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault()
          window.__CRICLAB_PWA.deferred = event
          window.dispatchEvent(new Event('criclab-pwa-prompt'))
        })
        window.addEventListener('appinstalled', function () {
          window.__CRICLAB_PWA.deferred = null
        })
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CricLab" />
    <meta name="application-name" content="CricLab" />
    <title>CricLab — The Cricket Performance Lab</title>
    <meta name="description" content="Turn a phone video of a delivery into measured, coachable insight. Bowling analysis, ball tracking and performance metrics for players, coaches and academies." />
    <meta name="theme-color" content="#05090a" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('criclab-theme');
          var theme =
            raw === 'light' || raw === 'dark'
              ? raw
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.add(theme);
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#05090a' : '#f6f9f7');
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <meta property="og:title" content="CricLab — The Cricket Performance Lab" />
    <meta property="og:description" content="Measured, coachable cricket insight from a single phone video." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
