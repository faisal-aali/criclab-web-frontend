<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CricLab — The Cricket Performance Lab</title>
    <meta name="description" content="Turn a phone video of a delivery into measured, coachable insight. Bowling and batting analysis, ball tracking and performance metrics for players, coaches and academies." />
    <meta name="theme-color" content="#05090a" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('criclab-theme');
          var theme =
            raw === 'light' || raw === 'dark'
              ? raw
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.add(theme);
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#05090a' : '#f6f9f7');
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <meta property="og:title" content="CricLab — The Cricket Performance Lab" />
    <meta property="og:description" content="Measured, coachable cricket insight from a single phone video." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
